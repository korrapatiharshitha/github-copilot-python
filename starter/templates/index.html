<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="game-status" aria-live="polite">
    <span>Time: <strong id="timer">00:00</strong></span>
    <span id="hints-used">Hints used: 0</span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="theme-toggle" type="button" aria-label="Theme" aria-pressed="false">Light mode</button>
    <span id="difficulty-status" aria-live="polite">Selected difficulty: Medium</span>
    <span id="message"></span>
  </div>
  <section id="completion-panel" class="completion-panel" hidden>
    <h2>Puzzle complete</h2>
    <label for="player-name">Your name</label>
    <input id="player-name" name="player-name" type="text" maxlength="40" autocomplete="name">
    <button id="save-score" type="button">Save Score</button>
  </section>
  <section class="scores-panel" aria-labelledby="scores-heading">
    <h2 id="scores-heading">Top 10</h2>
    <ol id="scores-list"></ol>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
